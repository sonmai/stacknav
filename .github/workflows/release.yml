name: Release VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci
      - run: npm test

      - name: Set release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const match = /^(\d+)\.(\d+)\.\d+$/.exec(version);
          const run = process.env.GITHUB_RUN_NUMBER;
          if (!match || !/^[1-9]\d*$/.test(run)) {
            throw new Error('Expected a stable package version and a positive run number');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${match[1]}.${match[2]}.${run}\n`);
          NODE

      - name: Package VSIX
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm run package:vsix

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          asset="stacknav-$VERSION.vsix"
          test -f "$asset"

          # Re-running a completed run must not replace an existing release.
          if release_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$release_draft" = "false" ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "StackNav $VERSION" --generate-notes
          fi

          # Recover a draft left behind by an interrupted upload.
          gh release upload "$tag" "$asset" --clobber
          gh release edit "$tag" --draft=false
